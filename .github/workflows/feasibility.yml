name: Feasibility check

# Manual run only (Actions tab → "Run workflow", or `gh workflow run`).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reach-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - run: python -m collector.feasibility
