name: Heartbeat

# GitHub switches off scheduled workflows in a public repository after 60 days without
# repository activity. Once a month this (1) turns the scheduled workflows on again and
# (2) records a commit on the branch "keepalive", so the daily run keeps going.
on:
  schedule:
    - cron: "23 5 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Turn the scheduled workflows on (harmless when they already are)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for workflow in daily.yml freshness.yml heartbeat.yml; do
            gh workflow enable "$workflow" || echo "could not enable $workflow"
          done
      - name: Record a commit on the keepalive branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan keepalive-new
          git rm -rfq .
          date -u +"%Y-%m-%dT%H:%M:%SZ" > heartbeat.txt
          git add heartbeat.txt
          git commit -qm "Heartbeat $(cat heartbeat.txt)"
          git push --force origin keepalive-new:keepalive
