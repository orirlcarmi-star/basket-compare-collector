name: Freshness check

# Is the published data younger than 36 hours? Separate from the daily run on purpose: it
# also catches a daily run that never started. Opens an issue when the data is stale and
# closes it when the data is fresh again.
on:
  schedule:
    - cron: "41 */6 * * *"
    # Catch-up slots: every hour from 05:23 to 19:23 UTC (07:23 to 21:23 in winter, one hour later
    # in summer). Many slots, because GitHub may drop some: one that fires is enough.
    - cron: "23 5-19 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: write # to start the daily run when the morning run did not happen

jobs:
  freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Check
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "הנתונים באתר ישנים (יותר מ-36 שעות)"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set +e
          gh release download site-data-latest --pattern meta.json --clobber || echo "no meta.json"
          python -m collector.daily stale --meta meta.json > message.txt
          code=$?
          cat message.txt
          existing=$(gh issue list --state open --json number,title \
            | jq -r --arg t "$TITLE" 'map(select(.title == $t))[0].number // empty')
          if [ "$code" -ne 0 ]; then
            printf '%s\n\nפרטי הבדיקה: %s\n' "$(cat message.txt)" "$RUN_URL" > body.md
            if [ -n "$existing" ]; then
              gh issue comment "$existing" --body-file body.md
            else
              gh issue create --title "$TITLE" --body-file body.md
            fi
          elif [ -n "$existing" ]; then
            gh issue close "$existing" --comment "הנתונים עודכנו, הבעיה נפתרה."
          fi
          exit 0

      - name: Start the daily run if the morning one did not publish
        # The daily run is scheduled, and GitHub sometimes does not start scheduled runs. From 07:00
        # to 22:59 in Israel, when nothing was published today, no daily run is waiting or running
        # and none was started in the last two hours, start it here. At most three daily runs
        # work in one day (the morning one and two more): after that, only an issue. The daily
        # run's own gate checks again. The decisions are in src/collector/daily.py (should_catch_up).
        env:
          GH_TOKEN: ${{ github.token }}
          LIMIT_TITLE: "העדכון היומי לא פורסם היום, גם אחרי שלוש ריצות"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/workflows/daily.yml
        run: |
          gh run list --workflow daily.yml --limit 100 \
            --json databaseId,status,createdAt,startedAt,updatedAt > runs.json || echo '[]' > runs.json
          out=$(python -m collector.daily catch-up --meta meta.json --runs runs.json 2> reason.txt)
          cat reason.txt
          go=$(echo "$out" | sed -n 's/^run=//p')
          limited=$(echo "$out" | sed -n 's/^limit=//p')
          existing=$(gh issue list --state open --json number,title \
            | jq -r --arg t "$LIMIT_TITLE" 'map(select(.title == $t))[0].number // empty')
          if [ "$go" = "true" ]; then
            echo "Nothing was published today: starting the daily run"
            gh workflow run daily.yml
          elif [ "$limited" = "true" ]; then
            printf 'שלוש ריצות יומיות כבר עבדו היום ועדיין לא פורסם עדכון. לא תתחיל ריצה נוספת מעצמה, כדי לא להעמיס על שרתי הרשתות.\n\nפרטים: %s\n' "$RUN_URL" > limit.md
            if [ -n "$existing" ]; then
              gh issue comment "$existing" --body-file limit.md
            else
              gh issue create --title "$LIMIT_TITLE" --body-file limit.md
            fi
          elif grep -q "already updated today" reason.txt && [ -n "$existing" ]; then
            gh issue close "$existing" --comment "העדכון של היום פורסם, הבעיה נפתרה."
          fi
