name: Check product names

# Manual run only. Downloads ONE price file per chain and reports how long the item names are
# in the chain's own file (are they cut by the chain, or by us?). Nothing is saved or changed;
# see src/collector/namecheck.py.
on:
  workflow_dispatch:
    inputs:
      chains:
        description: "Chains, separated by spaces"
        default: "ramilevi osherad yohananof"

permissions:
  contents: read

jobs:
  names:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Check
        env:
          CHAINS: ${{ inputs.chains }}
        run: |
          set -o pipefail
          {
            echo "## Item name lengths"
            echo
            echo '```'
            python -m collector.namecheck $CHAINS || true
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
